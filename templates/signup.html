<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN'crossorigin="anonymous">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <style>
           .a{
            position: fixed;
            top: 30px;
            width: 655px;
            margin-left: 340px;
            border: 1px solid black;
            padding: 20px;
           }
    </style>
</head>
<body>
    <form action="/signup" method="post">
        <div class="a">
		<h2 style="padding-left: 225px;">Register</h2>
		<p class="hint-text">Create your account. It's free and only takes a minute.</p>
        <div class="form-group">
			<div class="row">
				<div class="col" style="margin: 15px;"><input type="text" class="form-control" name="first_name" placeholder="First Name" required="required"></div>
				<div class="col" style="margin: 15px;"><input type="text" class="form-control" name="last_name" placeholder="Last Name" required="required"></div>
			</div>        	
        </div>
        <div class="form-group">
        	<input style="margin: 15px;" type="email" class="form-control" name="email" placeholder="Email" required="required">
        </div>
        <div class="form-group">
        	<input style="margin: 15px;" type="text" class="form-control" name="mobile" placeholder="Mobile" required="required">
        </div>
        <div class="form-group">
        	<input style="margin: 15px;" type="text" class="form-control" name="position" placeholder="Position" required="required">
        </div>
		<div class="form-group">
            <input style="margin: 15px;" type="password" class="form-control" name="password" placeholder="Password" required="required">
        </div>
		<div class="form-group">
            <input style="margin: 15px;" type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required="required">
        </div>        
        <div class="form-group">
			<label style="margin: 15px;" class="form-check-label"><input type="checkbox" name="checkbox" required="required"> I accept the <a href="#">Terms of Use</a> &amp; <a href="#">Privacy Policy</a></label>
		</div>
		<div class="form-group">
            <button style="margin: 15px;" type="submit" class="btn btn-success btn-lg btn-block">Register Now</button>
        </div>
        {% if error %}
            <div class="error">{{error}}</div>
        {% endif %}
    </div>
    </form>
</body>
<script src="{{url_for('static', filename='js/api.js')}}"></script>
<script src="{{url_for('static', filename='js/main.js')}}"></script>
</html>
