<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="{{url_for('static', filename='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN')}}" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
            position: absolute;
            top: 35px;
            right: 90px;
            
        }
        li{
            float: left;
            padding: 0 15px;
        }
        a{
            text-decoration: none;
            opacity: 1;
            color: black;
            font-size: 25px;
            font-family: 'Courier New', Courier, monospace;
            transition: .18s ease-in-out;
        }
        a:hover{
            opacity: 0.6;
        }

        .a{
            position: fixed;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100px;
            border: 1px solid #000;
            background-color: rgb(245, 245, 245);
        }
        .b{
            position: fixed;
            top: 250px;
            left:600px;
        }
        .logout{
            padding: 6px;
            outline: none;
            text-transform: capitalize;
            border-radius: 6px;
            border: none;
            border: 1px solid black;
            width: 120px;
            font-size: 16px;
        }
        .logout:hover{
            cursor: pointer;
            opacity: 0.7;
        }
        .submit{
            padding: 10px;
            outline: none;
            text-transform: capitalize;
            border-radius: 6px;
            border: none;
            border: 1px solid black;
            width: 170px;
            font-size: 25px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .submit:hover{
            cursor: pointer;
            opacity: 0.7;
        }
        .left{
            position: absolute;
            left: 30px;
        }
        .names{
            color: blue;
            text-decoration: underline;
        }
        .names:hover{
            opacity: 1;
        }
    </style>
</head>
<body>
    <form action="/", method="post">
        <div class="a">
        <ul class="nav nav-pills">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/login">Login</a>
            </li>
            {% if name%}
            <li class="nav-item">
              <a class="nav-link names" href="/">{{name}}</a>
            </li>
            {% endif %}
            <li class="nav-item">
                <button type="submit" name="sub_btn" value="logout" class="logout">logout</button>
              </li>
          </ul>
        </div>

        <div class="b">
            <button type="submit" name="sub_btn" value="start" class="submit">Show attendence</button>
        </div>
        </form>
</body>
<script src="{{url_for('static', filename='js/api.js')}}"></script>
<script src="{{url_for('static', filename='js/main.js')}}"></script>
</html>
